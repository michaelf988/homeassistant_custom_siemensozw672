name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  # Home Assistant and HACS both move without us, so a scheduled run catches a
  # break in their checks before a release does.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The icon and logo are bundled with the integration rather than
          # submitted to the home-assistant/brands repository.
          ignore: brands

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.8 requires Python 3.14.
          python-version: "3.14"
          cache: pip
          # The cache only looks for requirements.txt/pyproject.toml by default and
          # hard-fails when it finds neither.
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest
